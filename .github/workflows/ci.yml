name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce 800-line ratchet
        run: npm run check:size

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm run test

      # 04-⑧：coverage ratchet（阈值见 vite.config.ts，先松后紧）
      - name: Coverage gate
        run: npm run test:coverage

      # `npm run lint` currently has 92 pre-existing errors; wire it back
      # after the existing frontend violations are cleaned up.

  backend:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cargo fmt --all -- --check` is not wired yet: the repository has
      # pre-existing rustfmt drift in multiple files. Format the tree once
      # in a dedicated PR, then turn this into a hard gate.

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # 04-⑦：clippy 硬门禁（lib + tests）。噪音类 lint 的 allow 决策见
      # src-tauri/Cargo.toml 的 [lints.clippy] 表。
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings

      # `cargo fmt --all -- --check` is not wired yet: the repository has
      # pre-existing rustfmt drift in multiple files. Format the tree once
      # in a dedicated PR, then turn this into a hard gate.

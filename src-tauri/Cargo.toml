[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NineClaw"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
fern = { version = "0.7", features = ["date-based"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ort = "2.0.0-rc.12"
sqlite-vec = "0.1"
tokenizers = "0.20"
ndarray = "0.17"
async-trait = "0.1"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["limit"] }
md-5 = "0.10"
base64 = "0.22"
qrcode = "0.14"
rand = "0.8"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
openssl = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSAlert",
    "NSApplication",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSScrollView",
    "NSText",
    "NSTextView",
    "NSView",
    "NSWindow",
    "block2",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# "test" 特性提供 tauri::test::mock_app，用于 emit_safe 等单测
tauri = { version = "2.10.3", features = ["protocol-asset", "test"] }
